<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Curso FortiGate 7.6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Versão para impressão do curso: A4, tema claro. Gerada por tools/pdf/gerar-pdf.cjs. */
@page { size: A4; margin: 18mm 16mm 20mm; }
@page :first { margin: 0; }
:root {
  --text: #1d2229;
  --muted: #59616c;
  --faint: #8a929c;
  --line: #dde1e6;
  --panel: #f5f6f8;
  --accent: #c27a12;
  --h2: #b0670c;
  --h3: #24599c;
  --h4: #1d7a67;
  --warn: #c2412c;
  --tip: #1d7a67;
  --exam: #5b47c4;
  --note: #59616c;
  --code: #f3f4f6;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--text); }
body { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 10.5pt; line-height: 1.55; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* Capa */
.cover { height: 297mm; display: flex; flex-direction: column; justify-content: space-between; padding: 26mm 22mm; background: #14171c; color: #e8ebef; break-after: page; }
.cover .brand { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 20pt; letter-spacing: 0.01em; }
.cover .brand b { color: #e8a94f; }
.cover .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10pt; letter-spacing: 0.14em; text-transform: uppercase; color: #e8a94f; margin-bottom: 6mm; }
.cover h1 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 36pt; line-height: 1.1; margin: 0 0 8mm; color: #fff; }
.cover .sub { font-size: 12pt; color: #aeb5be; max-width: 140mm; }
.cover .foot { font-size: 9pt; color: #7d858f; border-top: 1px solid #2c323a; padding-top: 5mm; }

/* Sumário */
.toc { break-after: page; }
.toc h2 { font-family: "IBM Plex Sans Condensed", sans-serif; color: var(--text); font-size: 20pt; margin: 0 0 6mm; border: 0; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li.l2 { font-weight: 600; color: var(--h2); margin-top: 3.2mm; font-size: 11pt; }
.toc li.l3 { color: var(--muted); padding-left: 7mm; font-size: 10pt; margin-top: 1mm; }

/* Texto */
.doc h1 { display: none; }
.doc h2 { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 19pt; line-height: 1.2; color: var(--h2); margin: 0 0 5mm; padding-bottom: 2.5mm; border-bottom: 1.5px solid #ecd2ad; break-before: page; break-after: avoid; }
.doc h3 { font-size: 13.5pt; color: var(--h3); margin: 8mm 0 3mm; break-after: avoid; }
.doc h4 { font-size: 11.5pt; color: var(--h4); margin: 6mm 0 2mm; break-after: avoid; }
.doc p, .doc ul, .doc ol { margin: 0 0 3mm; }
.doc ul, .doc ol { padding-left: 6mm; }
.doc li { margin: 1mm 0; }
.doc strong { color: #0f1318; }
.doc a { color: var(--h3); text-decoration: none; }
.doc code { font-family: "JetBrains Mono", monospace; font-size: 0.86em; background: var(--code); color: #8a4b05; padding: 0.2mm 1.2mm; border-radius: 3px; }
.doc hr { display: none; }
.doc table { width: 100%; border-collapse: collapse; margin: 0 0 4mm; font-size: 9.5pt; break-inside: auto; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 1.8mm 2.5mm; border-bottom: 1px solid var(--line); }
.doc th { background: var(--panel); font-size: 8pt; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.doc tr { break-inside: avoid; }

.codeblock { margin: 0 0 4mm; border: 1px solid var(--line); border-radius: 2mm; background: var(--code); break-inside: avoid; }
.codeblock .head { font-family: "JetBrains Mono", monospace; font-size: 7pt; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 1.5mm 3mm; border-bottom: 1px solid var(--line); }
.codeblock pre { margin: 0; padding: 2.5mm 3mm; white-space: pre-wrap; word-break: break-word; font-size: 8.4pt; line-height: 1.45; }
.codeblock pre code { background: none; padding: 0; color: #1d2229; font-size: 1em; }
.codeblock.output { background: #f1f7f5; border-color: #c6e1d8; }
.codeblock.output .head { color: var(--h4); }

.callout { --c: var(--note); border: 1px solid var(--line); border-left: 1.2mm solid var(--c); border-radius: 2mm; padding: 3mm 4mm; margin: 0 0 4mm; background: color-mix(in srgb, var(--c) 6%, white); break-inside: avoid; }
.callout > :last-child { margin-bottom: 0; }
.callout p { margin: 0 0 2mm; }
.callout .ch { display: flex; align-items: center; gap: 2mm; color: var(--c); font-weight: 600; margin-bottom: 1.5mm; }
.callout .ch svg { width: 4.5mm; height: 4.5mm; }
.callout.warn { --c: var(--warn); }
.callout.tip { --c: var(--tip); }
.callout.exam { --c: var(--exam); }

.fig { margin: 2mm 0 5mm; border: 1px solid var(--line); border-radius: 2.5mm; overflow: hidden; break-inside: avoid; background: #fff; }
.fig img { display: block; width: 100%; max-height: 120mm; object-fit: contain; background: #0f1114; }
.fig .cap { padding: 2.5mm 4mm 3mm; background: var(--panel); font-size: 9.5pt; color: var(--muted); }
.fig .cap p { margin: 0 0 1.5mm; }
.fig .cap p:last-child { margin: 0; }
.fig .cap strong { color: var(--text); }
.steps-title { font-family: "JetBrains Mono", monospace; font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 3mm 0 2mm; break-after: avoid; }
.step .cap { display: flex; gap: 3mm; align-items: flex-start; }
.steps.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 0 4mm; }
.steps.grade .steps-title { grid-column: 1 / -1; }
.steps.grade .fig { margin: 0 0 4mm; }
.steps.grade .fig img { max-height: 75mm; }
.steps.grade .fig .cap { font-size: 8.8pt; padding: 2mm 3mm 2.5mm; }
.step .num { flex: none; min-width: 6mm; height: 6mm; border-radius: 3mm; background: var(--accent); color: #fff; font-weight: 600; font-size: 8.5pt; display: grid; place-items: center; padding: 0 1.5mm; }

.cli { border: 1.5px solid #c9ced6; border-radius: 3mm; margin: 6mm 0 4mm; padding: 0 5mm 3mm; background: #fbfbfc; }
.cli-head { display: flex; align-items: center; gap: 3mm; margin: 0 -5mm 4mm; padding: 3mm 5mm; background: #20252c; color: #fff; border-radius: 2.5mm 2.5mm 0 0; break-after: avoid; }
.cli-head .ico { font-family: "JetBrains Mono", monospace; color: #e8a94f; border: 1px solid #3a414b; border-radius: 1.5mm; padding: 0.5mm 2mm; font-size: 9pt; }
.cli-head b { font-size: 11pt; }
.cli-head span { color: #aeb5be; font-size: 9pt; }
.cli h3 { font-size: 11.5pt; color: var(--h3); margin: 5mm 0 2mm; }
.cli h3:first-of-type { margin-top: 0; }

.quiz { border: 1px solid var(--line); border-radius: 2.5mm; padding: 3.5mm 4.5mm; margin: 0 0 4mm; break-inside: avoid; }
.quiz .qn { font-family: "JetBrains Mono", monospace; font-size: 7.5pt; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5mm; }
.quiz .stem p { margin: 0 0 2mm; }
.quiz .stem img { display: block; max-width: 110mm; max-height: 70mm; margin: 1mm 0 3mm; border: 1px solid var(--line); border-radius: 2mm; }
.quiz .opt { display: flex; gap: 3mm; align-items: flex-start; padding: 1.5mm 2.5mm; border: 1px solid var(--line); border-radius: 1.8mm; margin-top: 1.5mm; }
.quiz .opt .l { flex: none; width: 5.5mm; height: 5.5mm; border-radius: 50%; border: 1px solid #b8bec6; display: grid; place-items: center; font-weight: 600; font-size: 8.5pt; color: var(--muted); }
.quiz.multi .opt .l { border-radius: 1.2mm; }
.answers { break-before: page; }
.answers h2 { break-before: avoid; }
.ans { margin: 0 0 3.5mm; break-inside: avoid; }
.ans .h { font-weight: 600; color: var(--text); }
.ans .h span { color: var(--tip); }
.ans p { margin: 1mm 0 0; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
