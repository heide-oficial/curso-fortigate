<title>Curso FortiGate 7.6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Leitor do curso: índice do curso à esquerda (módulos expansíveis com capítulos e seções) e o texto ao centro. Tema escuro único, por escolha. */
:root {
  color-scheme: dark;
  --bg: #111317;
  --panel: #15181c;
  --raise: #1c2026;
  --raise-2: #222730;
  --line: #262b32;
  --line-strong: #343a43;
  --text: #d8dce2;
  --muted: #8c939d;
  --faint: #626a75;
  --accent: #e2a654;
  --accent-soft: rgba(226, 166, 84, 0.12);
  --code-bg: #0c0e11;

  --h2: #e8b066;
  --h3: #8ab8f2;
  --h4: #7fcbb8;

  --warn: #ee8a76;
  --warn-bg: rgba(238, 138, 118, 0.08);
  --tip: #74c3b1;
  --tip-bg: rgba(116, 195, 177, 0.07);
  --exam: #ab9ef0;
  --exam-bg: rgba(171, 158, 240, 0.08);
  --note: #9aa3ae;
  --note-bg: rgba(140, 147, 157, 0.07);

  --ok: #5fc27e;
  --ok-bg: rgba(95, 194, 126, 0.1);
  --bad: #ef6f62;
  --bad-bg: rgba(239, 111, 98, 0.1);

  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --sidebar-w: 320px;
  --topbar-h: 56px;
}

html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--panel);
}
a { color: inherit; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  box-sizing: border-box;
  height: 100vh;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-block: 24px 28px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
}

.brand { display: flex; flex-direction: column; gap: 4px; padding-inline: 8px; text-decoration: none; }
.brand-name { font-family: var(--font-display); font-size: 1.32rem; letter-spacing: 0.01em; color: var(--text); line-height: 1.2; }
.brand-name b { color: var(--accent); font-weight: 600; }
.brand-meta { font-size: 0.78rem; color: var(--faint); }

.search {
  width: 100%;
  box-sizing: border-box;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font: inherit;
  font-size: 0.88rem;
}
.search::placeholder { color: var(--faint); }
.search:focus { border-color: var(--line-strong); outline: none; }

.progress { display: flex; flex-direction: column; gap: 6px; padding-inline: 8px; }
.progress-label { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.progress-label b { color: var(--text); font-weight: 500; }
.progress-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }

.nav { display: flex; flex-direction: column; gap: 16px; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); padding: 0 8px 6px; }

.nav-mod { display: flex; flex-direction: column; }
.nav-row { display: flex; align-items: stretch; border-radius: 6px; }
.nav-row:hover { background: var(--raise); }
.nav-mod.current > .nav-row { background: var(--raise); }
.nav-toggle {
  width: 26px; flex: none; border: 0; background: transparent; color: var(--faint);
  display: grid; place-items: center; cursor: pointer; border-radius: 6px 0 0 6px; padding: 0;
}
.nav-toggle:hover { color: var(--text); }
.nav-toggle svg { width: 14px; height: 14px; transition: transform 0.15s ease; }
.nav-mod.open > .nav-row .nav-toggle svg { transform: rotate(90deg); }
.nav-toggle[disabled] { cursor: default; visibility: hidden; }
.nav-link {
  flex: 1; min-width: 0;
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: baseline; gap: 6px;
  padding: 6px 8px 6px 0;
  text-decoration: none; color: var(--muted); font-size: 0.88rem; line-height: 1.35;
}
.nav-mod.current > .nav-row .nav-link { color: var(--text); }
.nav-num { font-family: var(--font-mono); font-size: 0.74rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-mod.current > .nav-row .nav-num { color: var(--accent); }
.nav-tag { font-size: 0.66rem; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 7px; align-self: center; white-space: nowrap; }
.nav-done { color: var(--ok); align-self: center; display: grid; }
.nav-done svg { width: 15px; height: 15px; }

.nav-sub { list-style: none; margin: 2px 0 6px 25px; padding: 0; border-left: 1px solid var(--line); display: none; }
.nav-mod.open > .nav-sub { display: block; }
.nav-sub a {
  display: block; text-decoration: none; color: var(--faint);
  padding: 4px 8px 4px 12px; margin-left: -1px; border-left: 2px solid transparent;
  font-size: 0.82rem; line-height: 1.4;
}
.nav-sub a:hover { color: var(--text); }
.nav-sub a.lvl-2 { color: var(--muted); }
.nav-sub a.lvl-3 { padding-left: 24px; font-size: 0.79rem; }
.nav-sub a.on-chapter { color: var(--h2); }
.nav-sub a.on { color: var(--text); border-left-color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent 80%); }
.nav-sub a.lvl-3.on { color: var(--h3); border-left-color: var(--h3); background: linear-gradient(90deg, rgba(138, 184, 242, 0.1), transparent 80%); }
.nav-empty { font-size: 0.82rem; color: var(--faint); padding: 4px 8px; }

/* ---------- Topbar (telas estreitas) ---------- */
.topbar {
  display: none;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  height: var(--topbar-h);
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.menu-btn {
  background: transparent; border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.menu-btn svg { width: 18px; height: 18px; }
.topbar-title { min-width: 0; font-size: 0.92rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title b { color: var(--text); font-weight: 500; }
.backdrop { display: none; }

/* ---------- Conteúdo ---------- */
.main { min-width: 0; padding-block: 48px 96px; padding-left: 64px; padding-right: max(40px, env(safe-area-inset-right, 0px)); }
.article { min-width: 0; max-width: 800px; margin-inline: auto; }

.status { color: var(--muted); padding: 40px 0; }
.status.error { color: var(--warn); }
.status button {
  margin-top: 12px; background: var(--raise); color: var(--text);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 14px; cursor: pointer;
}

/* Tipografia do documento */
.doc { font-size: 1rem; }
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4 { text-wrap: balance; scroll-margin-top: 28px; }
.doc-eyebrow { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
.doc h1 { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.15; letter-spacing: -0.005em; margin: 0 0 24px; color: #f1f3f6; }
.doc h2 {
  font-family: var(--font-display); font-size: 1.6rem; line-height: 1.25; color: var(--h2);
  margin: 64px 0 18px; padding-bottom: 10px; border-bottom: 1px solid rgba(232, 176, 102, 0.22);
}
.doc h3 { font-size: 1.2rem; font-weight: 600; line-height: 1.35; margin: 44px 0 12px; color: var(--h3); }
.doc h4 { font-size: 1.02rem; font-weight: 600; margin: 30px 0 8px; color: var(--h4); }
.doc p, .doc ul, .doc ol { margin: 0 0 16px; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 5px 0; }
.doc li > p { margin: 0 0 6px; }
.doc li::marker { color: var(--faint); }
.doc strong { color: #eef0f3; font-weight: 600; }
.doc em { color: #b3b9c2; }
.doc a { color: var(--accent); text-underline-offset: 3px; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 56px 0; }
.doc code {
  font-family: var(--font-mono); font-size: 0.86em; background: var(--raise); color: #f0c987;
  padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere;
}
.doc img.inline-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

/* Blocos de código */
.codeblock { margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
.codeblock + .codeblock.is-output { margin-top: -12px; }
.codeblock-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint);
}
.codeblock-actions { display: flex; gap: 4px; }
.code-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid transparent; color: var(--muted);
  font-family: var(--font-body); font-size: 0.76rem; text-transform: none; letter-spacing: 0;
  padding: 3px 10px; border-radius: 6px; cursor: pointer;
}
.code-btn:hover { border-color: var(--line-strong); color: var(--text); }
.code-btn.output { color: var(--h4); border-color: rgba(127, 203, 184, 0.3); }
.code-btn.output[aria-expanded="true"] { background: rgba(127, 203, 184, 0.1); }
.code-btn svg { width: 14px; height: 14px; }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 0.84rem; line-height: 1.6; }
.codeblock code { background: none; padding: 0; color: #cfd6de; font-size: 1em; line-height: inherit; overflow-wrap: normal; white-space: pre; }
.codeblock.is-output { border-color: rgba(127, 203, 184, 0.28); background: #0b100f; }
.codeblock.is-output .codeblock-head { color: var(--h4); }
.codeblock.is-output code { color: #b9c9c4; }

/* Tabelas */
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.doc tr:last-child td { border-bottom: 0; }
.doc th { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--panel); }

/* Quadros */
.doc blockquote { margin: 0 0 20px; padding: 14px 18px; border-radius: 10px; background: var(--note-bg); border: 1px solid var(--line); }
.doc blockquote > :last-child { margin-bottom: 0; }
.doc blockquote p { margin-bottom: 8px; }
.callout { --c: var(--note); --cbg: var(--note-bg); background: var(--cbg) !important; border-color: color-mix(in srgb, var(--c) 26%, transparent) !important; border-left: 3px solid var(--c) !important; }
.callout-head { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--c); font-weight: 600; font-size: 0.92rem; letter-spacing: 0.01em; }
.callout-head svg { width: 18px; height: 18px; }
.callout-warn { --c: var(--warn); --cbg: var(--warn-bg); }
.callout-tip { --c: var(--tip); --cbg: var(--tip-bg); }
.callout-exam { --c: var(--exam); --cbg: var(--exam-bg); }

/* Mídia: figura e carrossel em card */
.media-card { margin: 6px 0 30px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.media-frame { position: relative; background: var(--code-bg); border-bottom: 1px solid var(--line); }
.media-card.no-caption .media-frame { border-bottom: 0; }
.media-frame img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.media-frame video { display: block; width: 100%; height: auto; background: var(--code-bg); }
.media-badge {
  position: absolute; top: 10px; left: 10px;
  font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text); background: rgba(12, 14, 17, 0.8); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 7px; pointer-events: none;
}
.zoom-hint {
  position: absolute; right: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.74rem; color: var(--text); background: rgba(12, 14, 17, 0.8); border: 1px solid var(--line-strong);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; opacity: 0; transition: opacity 0.15s ease;
}
.zoom-hint svg { width: 13px; height: 13px; }
.media-frame:hover .zoom-hint, .zoom-hint:focus-visible { opacity: 1; }
.media-frame.is-placeholder { border-bottom-style: dashed; }
.placeholder {
  aspect-ratio: 16 / 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 24px; text-align: center;
  background: repeating-linear-gradient(135deg, transparent 0 14px, rgba(255, 255, 255, 0.018) 14px 28px), var(--code-bg);
}
.placeholder-tag { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(226, 166, 84, 0.35); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.placeholder-desc { color: var(--text); font-size: 0.92rem; line-height: 1.5; max-width: 54ch; }
.caption { font-size: 0.93rem; color: var(--muted); line-height: 1.6; }
.caption p { margin: 0 0 6px; }
.caption p:last-child { margin-bottom: 0; }
.caption strong { color: var(--text); }
.caption code { font-size: 0.85em; }
.media-foot { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 8px; }

.carousel { outline: none; }
.carousel:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.carousel-captions { display: grid; }
.carousel-captions > .caption { grid-area: 1 / 1; visibility: hidden; }
.carousel-captions > .caption.on { visibility: visible; }
.carousel .media-frame { touch-action: pan-y; }
.carousel-bar { display: flex; align-items: center; gap: 10px; }
.step-badge { min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center; background: var(--accent); color: #1a1408; font: 600 0.78rem/1 var(--font-body); }
.step-total { font-size: 0.8rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.carousel-dots { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; justify-content: center; }
.carousel-dots button { width: 20px; height: 20px; border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; }
.carousel-dots button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); transition: width 0.15s ease; }
.carousel-dots button[aria-current="true"]::before { background: var(--accent); width: 16px; border-radius: 4px; }
.nav-btn {
  width: 34px; height: 34px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--text);
  display: grid; place-items: center; cursor: pointer;
}
.nav-btn:hover:not(:disabled) { border-color: var(--line-strong); background: var(--raise-2); }
.nav-btn:disabled { color: var(--faint); background: transparent; cursor: default; }
.nav-btn svg { width: 16px; height: 16px; }

/* Botão do guia CLI */
.cli-trigger {
  display: flex; align-items: center; gap: 14px; width: 100%; margin: 36px 0 8px; padding: 14px 16px;
  text-align: left; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.cli-trigger:hover { border-color: var(--line-strong); background: var(--raise); }
.cli-icon { flex: none; font-family: var(--font-mono); font-size: 0.82rem; color: var(--accent); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.cli-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.cli-text b { font-weight: 600; font-size: 0.95rem; }
.cli-text span { font-size: 0.82rem; color: var(--muted); }
.cli-arrow { margin-left: auto; color: var(--faint); flex: none; display: grid; }

/* Questões */
.quiz-score {
  display: flex; align-items: center; gap: 14px; margin: 0 0 22px; padding: 12px 16px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 0.9rem; color: var(--muted);
}
.quiz-score b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.quiz-score .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.quiz-score .bar i { display: block; height: 100%; }
.quiz-score .bar .ok { background: var(--ok); }
.quiz-score .bar .bad { background: var(--bad); }
.quiz { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.quiz.is-right { border-color: rgba(95, 194, 126, 0.45); }
.quiz.is-wrong { border-color: rgba(239, 111, 98, 0.45); }
.quiz-body { padding: 18px 20px 6px; }
.quiz-num { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; display: flex; gap: 10px; }
.quiz-num span { color: var(--faint); }
.quiz-stem { color: var(--text); }
.quiz-stem p { margin: 0 0 12px; }
.quiz-stem img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; margin: 4px 0 14px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 14px; padding: 0; }
.quiz-opt {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) 22px; gap: 10px; align-items: start;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; color: var(--text);
  transition: border-color 0.12s ease, background 0.12s ease;
}
.quiz-opt:hover { border-color: var(--line-strong); }
.quiz-opt input { position: absolute; opacity: 0; pointer-events: none; }
.quiz-opt .letter {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center;
  font: 600 0.8rem/1 var(--font-body); color: var(--muted);
}
.quiz.multi .quiz-opt .letter { border-radius: 6px; }
.quiz-opt .txt { padding-top: 2px; line-height: 1.5; }
.quiz-opt .txt p { margin: 0; }
.quiz-opt .mark { padding-top: 3px; display: grid; }
.quiz-opt .mark svg { width: 18px; height: 18px; }
.quiz-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.quiz-opt.sel .letter { background: var(--accent); border-color: var(--accent); color: #1a1408; }
.quiz-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.quiz.done .quiz-opt { cursor: default; }
.quiz.done .quiz-opt:not(.right):not(.wrong) { opacity: 0.6; }
.quiz-opt.right { border-color: var(--ok); background: var(--ok-bg); }
.quiz-opt.right .letter { background: var(--ok); border-color: var(--ok); color: #06210f; }
.quiz-opt.right .mark { color: var(--ok); }
.quiz-opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.quiz-opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: #2a0703; }
.quiz-opt.wrong .mark { color: var(--bad); }
.quiz-foot { display: flex; align-items: center; gap: 12px; padding: 12px 20px 16px; flex-wrap: wrap; }
.quiz-hint { font-size: 0.82rem; color: var(--faint); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 16px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--raise); color: var(--text); font-size: 0.9rem; font-weight: 500;

    tag.textContent = kind === "video" ? "Vídeo indisponível" : "Imagem indisponível";
    const desc = document.createElement("div");
    desc.className = "placeholder-desc";
    desc.textContent = spec.alt || "Mídia não encontrada.";
    box.append(tag, desc);
    frame.appendChild(box);
  }

  function buildFrame(spec, onZoom) {
    const kind = mediaKind(spec.src);
    const frame = document.createElement("div");
    frame.className = "media-frame";
    if (kind === "video") {
      const v = document.createElement("video");
      v.muted = true; v.loop = true; v.playsInline = true; v.controls = true; v.preload = "metadata";
      if (!reducedMotion) v.autoplay = true;
      v.setAttribute("aria-label", spec.alt || "Vídeo");
      v.addEventListener("error", () => placeholder(frame, spec, kind));
      v.src = spec.src;
      frame.appendChild(v);
      const badge = document.createElement("span");
      badge.className = "media-badge";
      badge.textContent = "Vídeo";
      frame.appendChild(badge);
    } else {
      const img = document.createElement("img");
      img.alt = spec.alt;
      img.decoding = "async";
      img.loading = "lazy";
      img.addEventListener("error", () => placeholder(frame, spec, kind));
      img.addEventListener("click", onZoom);
      img.src = spec.src;
      frame.appendChild(img);
      const hint = document.createElement("button");
      hint.type = "button";
      hint.className = "zoom-hint";
      hint.innerHTML = ICON.zoom + "Ampliar";
      hint.addEventListener("click", onZoom);
      frame.appendChild(hint);
      if (kind === "gif") {
        const badge = document.createElement("span");
        badge.className = "media-badge";
        badge.textContent = "GIF";
        frame.appendChild(badge);
      }
    }
    return frame;
  }

  function buildFigure(block) {
    const spec = parseSpec(block.args);
    const card = document.createElement("figure");
    card.className = "media-card";
    card.style.margin = "";
    if (!spec) { card.textContent = "Figura sem arquivo definido."; return card; }
    const capHtml = block.body.trim() ? md(block.body.trim()) : "";
    card.appendChild(buildFrame(spec, () => openLightbox([{ src: spec.src, alt: spec.alt, cap: capHtml }], 0)));
    if (capHtml) {
      const foot = document.createElement("figcaption");
      foot.className = "media-foot caption";
      foot.innerHTML = capHtml;
      card.appendChild(foot);
    } else card.classList.add("no-caption");
    return card;
  }

  function buildSlides(block) {
    const items = block.body.split("\n").filter((l) => l.trim()).map(parseSpec).filter(Boolean)
      .map((it) => ({ src: it.src, alt: it.alt, cap: it.caption ? mdInline(it.caption) : "" }));
    const card = document.createElement("section");
    card.className = "media-card carousel";
    card.tabIndex = 0;
    card.setAttribute("aria-roledescription", "carrossel");
    card.setAttribute("aria-label", "Passo a passo com " + items.length + " imagens");
    if (!items.length) { card.textContent = "Carrossel sem imagens definidas."; return card; }

    let index = 0;
    const frames = items.map((it, i) => {
      const fr = buildFrame(it, () => openLightbox(items, index));
      fr.hidden = i !== 0;
      card.appendChild(fr);
      return fr;
    });
    const foot = document.createElement("div");
    foot.className = "media-foot";
    const bar = document.createElement("div");
    bar.className = "carousel-bar";
    const prev = document.createElement("button");
    prev.type = "button"; prev.className = "nav-btn"; prev.innerHTML = ICON.prev; prev.setAttribute("aria-label", "Imagem anterior");
    const next = document.createElement("button");
    next.type = "button"; next.className = "nav-btn"; next.innerHTML = ICON.next; next.setAttribute("aria-label", "Próxima imagem");
    const badge = document.createElement("span");
    badge.className = "step-badge";
    const total = document.createElement("span");
    total.className = "step-total";
    const dots = document.createElement("div");
    dots.className = "carousel-dots";
    const dotBtns = items.map((_, i) => {
      const d = document.createElement("button");
      d.type = "button";
      d.setAttribute("aria-label", "Ir para a imagem " + (i + 1));
      d.addEventListener("click", () => go(i));
      dots.appendChild(d);
      return d;
    });
    bar.append(badge, total, dots, prev, next);
    const captions = document.createElement("div");
    captions.className = "carousel-captions";
    captions.setAttribute("aria-live", "polite");
    const capEls = items.map((it) => {
      const c = document.createElement("div");
      c.className = "caption";
      c.innerHTML = it.cap || "";
      captions.appendChild(c);
      return c;
    });
    foot.append(bar, captions);
    card.appendChild(foot);

    function go(i) {
      index = Math.max(0, Math.min(items.length - 1, i));
      frames.forEach((f, k) => {
        f.hidden = k !== index;
        const v = f.querySelector("video");
        if (v) { if (k === index && !reducedMotion) v.play().catch(() => {}); else v.pause(); }
      });
      capEls.forEach((c, k) => { c.classList.toggle("on", k === index); c.setAttribute("aria-hidden", String(k !== index)); });
      badge.textContent = String(index + 1);
      total.textContent = "de " + items.length;
      prev.disabled = index === 0;
      next.disabled = index === items.length - 1;
      dotBtns.forEach((d, k) => d.setAttribute("aria-current", String(k === index)));
    }
    prev.addEventListener("click", () => go(index - 1));
    next.addEventListener("click", () => go(index + 1));
    card.addEventListener("keydown", (e) => {
      if (e.target !== card) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); go(index - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(index + 1); }
    });
    let startX = null;
    card.addEventListener("pointerdown", (e) => { if (e.target.closest(".media-frame")) startX = e.clientX; });
    card.addEventListener("pointerup", (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) > 48) go(index + (dx < 0 ? 1 : -1));
    });
    go(0);
    return card;
  }

  function buildCli(block) {
    const title = block.args || "Comandos desta seção";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cli-trigger";
    btn.innerHTML = '<span class="cli-icon" aria-hidden="true">&gt;_</span><span class="cli-text"><b>Guia de comandos CLI</b><span></span></span><span class="cli-arrow" aria-hidden="true">' + ICON.next + "</span>";
    btn.querySelector(".cli-text span").textContent = title;
    btn.addEventListener("click", () => openCli(title, block.body, btn));
    return btn;
  }

  /* Questão: enunciado em markdown, alternativas "- [ ]" / "- [x]" e justificativa em linhas "> ". */
  let quizCount = 0;
  function buildQuiz(block, ctx) {
    const lines = block.body.split("\n");
    const stem = [], opts = [], why = [];
    lines.forEach((l) => {
      const o = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
      if (o) { opts.push({ text: o[2], right: o[1].toLowerCase() === "x" }); return; }
      const w = l.match(/^>\s?(.*)$/);
      if (w) { why.push(w[1]); return; }
      if (!opts.length) stem.push(l); else if (l.trim()) why.push(l);
    });
    const rightCount = opts.filter((o) => o.right).length;
    const multi = rightCount > 1;
    const n = ++quizCount;
    const letters = "ABCDEFGH";
    const name = "q-" + ctx + "-" + n;

    const card = document.createElement("section");
    card.className = "quiz" + (multi ? " multi" : "");
    card.setAttribute("aria-label", "Questão " + n);
    const body = document.createElement("div");
    body.className = "quiz-body";
    const num = document.createElement("div");
    num.className = "quiz-num";
    num.textContent = "Questão " + n;
    const stemEl = document.createElement("div");
    stemEl.className = "quiz-stem";
    stemEl.innerHTML = md(stem.join("\n").trim());
    stemEl.querySelectorAll("img").forEach((img) => img.addEventListener("click", () => openLightbox([{ src: img.getAttribute("src"), alt: img.alt, cap: "" }], 0)));
    const list = document.createElement("div");
    list.className = "quiz-options";
    list.setAttribute("role", multi ? "group" : "radiogroup");
    const optEls = opts.map((o, i) => {
      const label = document.createElement("label");
      label.className = "quiz-opt";
      const input = document.createElement("input");
      input.type = multi ? "checkbox" : "radio";
      input.name = name;
      input.value = String(i);
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = letters[i];
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.innerHTML = mdInline(o.text);
      const mark = document.createElement("span");
      mark.className = "mark";
      label.append(input, letter, txt, mark);
      list.appendChild(label);
      input.addEventListener("change", () => { refresh(); });
      return { label, input, mark, right: o.right };
    });
    body.append(num, stemEl, list);

    const foot = document.createElement("div");
    foot.className = "quiz-foot";
    const submit = document.createElement("button");
    submit.type = "button";
    submit.className = "btn primary";
    submit.textContent = "Enviar";
    const hint = document.createElement("span");
    hint.className = "quiz-hint";
    const result = document.createElement("span");
    result.className = "quiz-result";
    result.hidden = true;
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "btn";
    retry.innerHTML = ICON.retry + "Tentar de novo";
    retry.hidden = true;
    foot.append(submit, hint, result, retry);

    const whyEl = document.createElement("div");
    whyEl.className = "quiz-why";
    whyEl.hidden = true;
    const rightLetters = opts.map((o, i) => (o.right ? letters[i] : null)).filter(Boolean);
    whyEl.innerHTML = '<div class="quiz-why-head">Justificativa <span>Resposta correta: ' + rightLetters.join(" e ") + "</span></div>" + md(why.join("\n").trim());
    card.append(body, foot, whyEl);

    function chosen() { return optEls.filter((o) => o.input.checked); }
    function refresh() {
      if (card.classList.contains("done")) return;
      optEls.forEach((o) => o.label.classList.toggle("sel", o.input.checked));
      const c = chosen().length;
      submit.disabled = multi ? c !== rightCount : c === 0;
      hint.textContent = multi && c !== rightCount ? "Marque " + rightCount + " alternativas." : "";
    }
    submit.addEventListener("click", () => {
      const sel = chosen();
      const ok = sel.length === rightCount && sel.every((o) => o.right);
      card.classList.add("done", ok ? "is-right" : "is-wrong");
      optEls.forEach((o) => {
        o.input.disabled = true;
        o.label.classList.remove("sel");
        if (o.right) { o.label.classList.add("right"); o.mark.innerHTML = ICON.check; }
        else if (o.input.checked) { o.label.classList.add("wrong"); o.mark.innerHTML = ICON.x; }
      });
      result.hidden = false;
      result.className = "quiz-result " + (ok ? "ok" : "bad");
      result.innerHTML = (ok ? ICON.checkCircle + "Resposta correta" : ICON.xCircle + "Resposta incorreta");
      submit.hidden = true;
      hint.textContent = "";
      retry.hidden = false;
      whyEl.hidden = false;
      card.dataset.result = ok ? "ok" : "bad";
      updateScore();
    });
    retry.addEventListener("click", () => {
      card.classList.remove("done", "is-right", "is-wrong");
      delete card.dataset.result;
      optEls.forEach((o) => {
        o.input.disabled = false;
        o.input.checked = false;
        o.label.classList.remove("right", "wrong", "sel");
        o.mark.innerHTML = "";
      });
      result.hidden = true;
      submit.hidden = false;
      retry.hidden = true;
      whyEl.hidden = true;
      refresh();
      updateScore();
      optEls[0].input.focus();
    });
    refresh();
    return card;
  }

  function updateScore() {
    const box = document.querySelector(".quiz-score");
    if (!box) return;
    const all = document.querySelectorAll("#doc .quiz");
    const ok = document.querySelectorAll('#doc .quiz[data-result="ok"]').length;
    const bad = document.querySelectorAll('#doc .quiz[data-result="bad"]').length;
    box.querySelector(".score-text").innerHTML = "Acertos: <b>" + ok + "</b> de <b>" + all.length + "</b>" + (ok + bad < all.length ? " · faltam " + (all.length - ok - bad) : "");
    box.querySelector(".ok").style.width = (ok / all.length) * 100 + "%";
    box.querySelector(".bad").style.width = (bad / all.length) * 100 + "%";
  }

  function mountBlocks(container, blocks, ctx) {
    let firstQuiz = true;
    container.querySelectorAll("div[data-block]").forEach((el) => {
      const b = blocks[Number(el.dataset.block)];
      if (!b) return;
      let node;
      if (b.type === "figura") node = buildFigure(b);
      else if (b.type === "slides") node = buildSlides(b);
      else if (b.type === "quiz") {
        node = buildQuiz(b, ctx);
        if (firstQuiz) {
          firstQuiz = false;
          const score = document.createElement("div");
          score.className = "quiz-score";
          score.innerHTML = '<span class="score-text"></span><span class="bar"><i class="ok"></i><i class="bad"></i></span>';
          el.parentNode.insertBefore(score, el);
        }
      } else node = buildCli(b);
      el.replaceWith(node);
    });
  }

  /* ---------- Guia CLI ---------- */
  const cliModal = $("cli-modal");
  let cliReturn = null;
  function openCli(title, body, trigger) {
    cliReturn = trigger;
    $("cli-modal-title").textContent = title;
    const bodyEl = $("cli-modal-body");
    const pre = preprocess(body);
    bodyEl.innerHTML = md(pre.md);
    mountBlocks(bodyEl, pre.blocks, "cli");
    enhanceBasic(bodyEl);
    bodyEl.scrollTop = 0;
    if (cliModal.showModal) cliModal.showModal(); else cliModal.setAttribute("open", "");
    $("cli-modal-close").focus();
  }
  function closeCli() { if (cliModal.close) cliModal.close(); else cliModal.removeAttribute("open"); }
  cliModal.addEventListener("close", () => { if (cliReturn) cliReturn.focus(); });
  cliModal.addEventListener("click", (e) => { if (e.target === cliModal) closeCli(); });
  $("cli-modal-close").addEventListener("click", closeCli);

  /* ---------- Ampliação com zoom e arraste ---------- */
  const lightbox = $("lightbox");
  const lbView = $("lb-view");
  const lbImg = $("lb-img");
  $("lb-prev").innerHTML = ICON.prev;
  $("lb-next").innerHTML = ICON.next;
  const lb = { items: [], index: 0, scale: 1, fit: 1, x: 0, y: 0, ret: null };

  function lbApply() {
    lbImg.style.transform = "translate(" + lb.x + "px," + lb.y + "px) scale(" + lb.scale + ")";
    $("lb-zoom").textContent = Math.round((lb.scale / lb.fit) * 100) + "%";
  }
  /* The caption card floats over the image with a fixed size, so the image never moves when the text changes. */
  function lbFit() {
    const w = lbImg.naturalWidth || 1920, h = lbImg.naturalHeight || 1080;
    const vw = lbView.clientWidth, vh = lbView.clientHeight;
    lb.fit = Math.min((vw - 48) / w, (vh - 112) / h, 1.5);
    lb.scale = lb.fit;
    lb.x = (vw - w * lb.scale) / 2;
    lb.y = Math.max(64, (vh - h * lb.scale) / 2);
    lbApply();
  }
  function lbZoomAt(factor, cx, cy) {
    const next = Math.min(lb.fit * 8, Math.max(lb.fit * 0.5, lb.scale * factor));
    const k = next / lb.scale;
    lb.x = cx - (cx - lb.x) * k;
    lb.y = cy - (cy - lb.y) * k;
    lb.scale = next;
    lbApply();
  }
  function lbShow(i) {
    lb.index = Math.max(0, Math.min(lb.items.length - 1, i));
    const it = lb.items[lb.index];
    const multi = lb.items.length > 1;
    $("lb-foot").hidden = !multi && !it.cap;
    $("lb-bar").hidden = !multi;
    $("lb-foot").classList.toggle("no-bar", !multi);
    $("lb-step").textContent = String(lb.index + 1);
    $("lb-total").textContent = "de " + lb.items.length;
    $("lb-prev").disabled = lb.index === 0;
    $("lb-next").disabled = lb.index === lb.items.length - 1;
    $("lb-caption").innerHTML = it.cap || "";
    $("lb-caption").hidden = !it.cap;
    lbImg.alt = it.alt || "";
    const same = lbImg.getAttribute("src") === it.src;
    lbImg.onload = lbFit;
    lbImg.src = it.src;
    if (same && lbImg.complete && lbImg.naturalWidth) lbFit();
  }
  function openLightbox(items, i) {
    lb.ret = document.activeElement;
    lb.items = items;
    if (lightbox.showModal) lightbox.showModal(); else lightbox.setAttribute("open", "");
    lbShow(i);
    $("lb-close").focus();
  }
  function closeLightbox() { if (lightbox.close) lightbox.close(); else lightbox.removeAttribute("open"); }
  lightbox.addEventListener("close", () => { if (lb.ret && lb.ret.focus) lb.ret.focus(); });
  lbView.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = lbView.getBoundingClientRect();
    lbZoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  let drag = null;
  const pointers = new Map();
  lbImg.draggable = false;
  lbImg.addEventListener("dragstart", (e) => e.preventDefault());
  lbView.addEventListener("contextmenu", (e) => e.preventDefault());
  lbView.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    lbView.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    drag = { x: e.clientX, y: e.clientY, ox: lb.x, oy: lb.y, moved: false, dist: null };
    lbView.classList.add("dragging");
  });
  lbView.addEventListener("pointermove", (e) => {
    if (!drag || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = lbView.getBoundingClientRect();
      if (drag.dist) lbZoomAt(d / drag.dist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      drag.dist = d;
      drag.moved = true;
      return;
    }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    lb.x = drag.ox + dx;
    lb.y = drag.oy + dy;
    lbApply();
  });
  const endDrag = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) { lbView.classList.remove("dragging"); drag = null; }
    else if (drag) { const p = [...pointers.values()][0]; drag = { x: p.x, y: p.y, ox: lb.x, oy: lb.y, moved: true, dist: null }; }
  };
  lbView.addEventListener("pointerup", endDrag);
  lbView.addEventListener("pointercancel", endDrag);
  lbView.addEventListener("dblclick", (e) => {
    const r = lbView.getBoundingClientRect();
    if (Math.abs(lb.scale - lb.fit) > 0.01) lbFit(); else lbZoomAt(2.5, e.clientX - r.left, e.clientY - r.top);
  });
  const center = () => [lbView.clientWidth / 2, lbView.clientHeight / 2];
  $("lb-in").addEventListener("click", () => lbZoomAt(1.4, ...center()));
  $("lb-out").addEventListener("click", () => lbZoomAt(1 / 1.4, ...center()));
  $("lb-fit").addEventListener("click", lbFit);
  $("lb-close").addEventListener("click", closeLightbox);
  $("lb-prev").addEventListener("click", () => lbShow(lb.index - 1));
  $("lb-next").addEventListener("click", () => lbShow(lb.index + 1));
  lightbox.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && lb.items.length > 1) { e.preventDefault(); lbShow(lb.index - 1); }
    if (e.key === "ArrowRight" && lb.items.length > 1) { e.preventDefault(); lbShow(lb.index + 1); }
    if (e.key === "+" || e.key === "=") lbZoomAt(1.4, ...center());
    if (e.key === "-") lbZoomAt(1 / 1.4, ...center());
    if (e.key === "0") lbFit();
  });
  window.addEventListener("resize", () => { if (lightbox.open) lbFit(); });

  /* ---------- Acabamento do documento ---------- */
  function codeLabel(text) {
    const first = text.split("\n")[0].trim();
    if (/^#config-version/.test(first)) return "Arquivo de configuração";
    if (/^(config|execute|diagnose|get|show|set|edit|append|unselect|FGT-?\S* #)/.test(first)) return "CLI";
    return "Texto";
  }

  function copyButton(text, target) {
    const btn = document.createElement("button");
    btn.className = "code-btn";
    btn.type = "button";
    btn.textContent = "Copiar";
    btn.addEventListener("click", () => {
      const done = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = "Copiar"), 1400); };
      const fallback = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        btn.textContent = "Selecionado — use Ctrl+C";
        setTimeout(() => (btn.textContent = "Copiar"), 2200);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
        else fallback();
      } catch (e) { fallback(); }
    });
    return btn;
  }

  function enhanceBasic(container) {
    let lastBox = null;
    container.querySelectorAll("pre").forEach((pre) => {
      const code = pre.querySelector("code");
      const isOutput = !!(code && /\blanguage-saida\b/.test(code.className));
      const text = (code ? code.textContent : pre.textContent).replace(/\n$/, "");
      const box = document.createElement("div");
      box.className = "codeblock" + (isOutput ? " is-output" : "");
      const head = document.createElement("div");
      head.className = "codeblock-head";
      const lbl = document.createElement("span");
      lbl.textContent = isOutput ? "Saída" : codeLabel(text);
      const actions = document.createElement("div");
      actions.className = "codeblock-actions";
      actions.appendChild(copyButton(text, code || pre));
      head.append(lbl, actions);
      const prevSibling = pre.previousElementSibling;
      pre.parentNode.insertBefore(box, pre);
      box.append(head, pre);
      if (isOutput && lastBox && prevSibling === lastBox) {
        box.hidden = true;
        const id = "out-" + Math.random().toString(36).slice(2, 8);
        box.id = id;
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "code-btn output";
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-controls", id);
        toggle.innerHTML = ICON.eye + "<span>Mostrar saída</span>";
        toggle.addEventListener("click", () => {
          const open = box.hidden;
          box.hidden = !open;
          toggle.setAttribute("aria-expanded", String(open));
          toggle.querySelector("span").textContent = open ? "Ocultar saída" : "Mostrar saída";
        });
        lastBox.querySelector(".codeblock-actions").prepend(toggle);
      }
      lastBox = box;
    });

    container.querySelectorAll("table").forEach((t) => {
      if (t.parentNode.classList && t.parentNode.classList.contains("table-wrap")) return;
      const w = document.createElement("div");
      w.className = "table-wrap";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });

    container.querySelectorAll("blockquote").forEach((bq) => {
      const first = bq.firstElementChild;
      const s = first && first.tagName === "P" ? first.firstElementChild : null;
      const strong = s && s.tagName === "STRONG" && first.firstChild === s ? s : null;
      const label = strong ? strong.textContent.trim().replace(/:$/, "") : "";
      const key = label.toLowerCase();
      let type = "note";
      if (key.startsWith("atenção")) type = "warn";
      else if (key.startsWith("na prática")) type = "tip";
      else if (key.startsWith("dica para a prova")) type = "exam";
      bq.classList.add("callout", "callout-" + type);
      if (!strong) return;
      const headEl = document.createElement("div");
      headEl.className = "callout-head";
      headEl.innerHTML = ICON[type];
      headEl.appendChild(document.createTextNode(label));
      strong.remove();
      if (first.firstChild && first.firstChild.nodeType === 3) first.firstChild.textContent = first.firstChild.textContent.replace(/^\s*:?\s*/, "");
      if (!first.textContent.trim() && !first.querySelector("img")) first.remove();
      bq.insertBefore(headEl, bq.firstChild);
    });
  }

  /* ---------- Índice ---------- */
  function outlineFrom(text) {
    const pre = preprocess(text);
    const tmp = document.createElement("div");
    tmp.innerHTML = md(pre.md);
    const used = new Set();
    const items = [];
    tmp.querySelectorAll("h1, h2, h3, h4").forEach((h) => {
      const slug = slugify(h.textContent, used);
      if (h.tagName === "H2" || h.tagName === "H3") items.push({ level: h.tagName === "H2" ? 2 : 3, text: h.textContent.trim(), slug });
    });
    return items;
  }

  async function loadOutlines() {
    await Promise.all(PAGES.filter((p) => p.file).map(async (p) => {
      try { outlines[p.id] = outlineFrom(await getText(p.file)); } catch (e) { outlines[p.id] = []; }
    }));
  }

  function navModule(p, q) {
    const done = doneSet();
    const wrap = document.createElement("div");
    wrap.className = "nav-mod";
    wrap.dataset.id = p.id;
    const row = document.createElement("div");
    row.className = "nav-row";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "nav-toggle";
    toggle.innerHTML = ICON.chev;
    const outline = (outlines[p.id] || []).filter((it) => !q || it.text.toLowerCase().includes(q) || (p.num + " " + p.title).toLowerCase().includes(q));
    if (!outline.length) toggle.disabled = true;
    toggle.setAttribute("aria-label", "Mostrar ou ocultar as seções de " + p.title);
    const a = document.createElement("a");
    a.className = "nav-link";
    a.href = "#" + p.id;
    a.innerHTML = '<span class="nav-num"></span><span class="nav-text"></span>';
    a.querySelector(".nav-num").textContent = p.num || "";
    if (!p.num) a.querySelector(".nav-num").innerHTML = ICON.book.replace("<svg ", '<svg class="i" style="width:14px;height:14px" ');
    a.querySelector(".nav-text").textContent = p.title;
    if (p !== INTRO && !p.file) {
      const tag = document.createElement("span");
      tag.className = "nav-tag";
      tag.textContent = "em breve";
      a.appendChild(tag);
    } else if (done.has(p.id)) {
      const tag = document.createElement("span");
      tag.className = "nav-done";
      tag.title = "Concluído";
      tag.innerHTML = ICON.checkCircle;
      a.appendChild(tag);
    }
    row.append(toggle, a);
    wrap.appendChild(row);
    if (outline.length) {
      const ul = document.createElement("ul");
      ul.className = "nav-sub";
      outline.forEach((it) => {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = "#" + p.id + "/" + it.slug;
        link.className = "lvl-" + it.level;
        link.dataset.slug = it.slug;
        link.textContent = it.text;
        li.appendChild(link);
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    }
    const isOpen = q ? outline.length > 0 : openSet.has(p.id);
    wrap.classList.toggle("open", isOpen && outline.length > 0);
    toggle.addEventListener("click", () => {
      const open = !wrap.classList.contains("open");
      wrap.classList.toggle("open", open);
      if (open) openSet.add(p.id); else openSet.delete(p.id);
      toggle.setAttribute("aria-expanded", String(open));
    });
    toggle.setAttribute("aria-expanded", String(wrap.classList.contains("open")));
    if (current && current.id === p.id) wrap.classList.add("current");
    return wrap;
  }

  function buildNav() {
    const q = ($("search").value || "").trim().toLowerCase();
    const nav = $("nav");
    nav.innerHTML = "";
    const groups = [
      { label: "Comece aqui", items: [INTRO] },
      { label: "Módulos", items: MODULES.filter((m) => !m.extra) },
      { label: "Além do NSE 4", items: MODULES.filter((m) => m.extra) }
    ];
    let shown = 0;
    groups.forEach((g) => {
      const items = g.items.filter((p) => !q || (p.num + " " + p.title).toLowerCase().includes(q) || (outlines[p.id] || []).some((it) => it.text.toLowerCase().includes(q)));
      if (!items.length) return;
      const wrap = document.createElement("div");
      wrap.className = "nav-group";
      const t = document.createElement("div");
      t.className = "nav-title";
      t.textContent = g.label;
      wrap.appendChild(t);
      items.forEach((p) => { wrap.appendChild(navModule(p, q)); shown++; });
      nav.appendChild(wrap);
    });
    if (!shown) nav.innerHTML = '<p class="nav-empty">Nada encontrado.</p>';
    spyUpdate(true);
  }

  function updateProgress() {
    const done = doneSet();
    const n = MODULES.filter((m) => done.has(m.id)).length;
    $("progress-count").innerHTML = "<b>" + n + "</b> de " + MODULES.length + " módulos";
    $("progress-fill").style.width = (n / MODULES.length) * 100 + "%";
  }

  /* Destaque do capítulo e da seção em leitura */
  let spyRaf = 0;
  function spyUpdate(force) {
    if (!current) return;
    const marker = (window.innerWidth <= 860 ? 72 : 24) + 60;
    let active = null, chapter = null;
    for (const h of spyHeads) {
      if (h.getBoundingClientRect().top - marker > 0) break;
      active = h;
      if (h.tagName === "H2") chapter = h;
    }
    if (active && active.tagName === "H3") {
      let k = spyHeads.indexOf(active);
      while (k >= 0 && spyHeads[k].tagName !== "H2") k--;
      chapter = k >= 0 ? spyHeads[k] : null;
    }
    const mod = document.querySelector('.nav-mod[data-id="' + current.id + '"]');
    document.querySelectorAll(".nav-sub a.on, .nav-sub a.on-chapter").forEach((a) => a.classList.remove("on", "on-chapter"));
    if (!mod) return;
    const find = (h) => h && mod.querySelector('.nav-sub a[data-slug="' + h.id + '"]');
    const chapLink = find(chapter);
    const actLink = find(active);
    if (chapLink) chapLink.classList.add(actLink === chapLink ? "on" : "on-chapter");
    if (actLink) actLink.classList.add("on");
    const target = actLink || chapLink;
    if (target && mod.classList.contains("open")) {
      const sb = $("sidebar");
      const r = target.getBoundingClientRect(), s = sb.getBoundingClientRect();
      if (r.top < s.top + 80 || r.bottom > s.bottom - 40) sb.scrollTop += r.top - s.top - s.height / 3;
    }
  }
  window.addEventListener("scroll", () => {
    if (spyRaf) return;
    spyRaf = requestAnimationFrame(() => { spyRaf = 0; spyUpdate(); });
  }, { passive: true });

  /* ---------- Renderização ---------- */
  function renderDoc(text, page) {
    const doc = $("doc");
    quizCount = 0;
    const pre = preprocess(text);
    doc.innerHTML = md(pre.md);
    const used = new Set();
    doc.querySelectorAll("h1, h2, h3, h4").forEach((h) => { h.id = slugify(h.textContent, used); });
    const h1 = doc.querySelector("h1");
    if (h1 && page !== INTRO) {
      const eyebrow = document.createElement("div");
      eyebrow.className = "doc-eyebrow";
      eyebrow.textContent = (page.extra ? "Apêndice " : "Módulo ") + page.num;
      h1.textContent = h1.textContent.replace(/^(Módulo|Apêndice)\s+\S+\s+[—-]\s+/, "");
      doc.insertBefore(eyebrow, h1);
    }
    doc.querySelectorAll("img").forEach((img) => {
      if (img.closest(".media-card")) return;
      img.classList.add("inline-img");
      img.addEventListener("click", () => openLightbox([{ src: img.getAttribute("src"), alt: img.alt, cap: "" }], 0));
    });
    mountBlocks(doc, pre.blocks, page.id);
    enhanceBasic(doc);
    updateScore();
    spyHeads = Array.from(doc.querySelectorAll("h2, h3"));
  }

  function renderSoon(page) {
    const doc = $("doc");
    doc.innerHTML = "";
    const eyebrow = document.createElement("div");
    eyebrow.className = "doc-eyebrow";
    eyebrow.textContent = (page.extra ? "Apêndice " : "Módulo ") + page.num;
    const h1 = document.createElement("h1");
    h1.textContent = page.title;
    const soon = document.createElement("div");
    soon.className = "soon";
    soon.innerHTML = '<span class="pill">Em breve</span><p></p>';
    soon.querySelector("p").textContent = page.desc;
    doc.append(eyebrow, h1, soon);
    spyHeads = [];
  }

  function renderFinish(page) {
    const box = $("finish");
    box.innerHTML = "";
    if (!page.file) return;
    const order = PAGES.filter((p) => p.file || p === INTRO);
    const all = PAGES;
    const i = all.indexOf(page);
    const next = all[i + 1];
    const wrap = document.createElement("div");
    wrap.className = "finish";
    const text = document.createElement("div");
    text.className = "finish-text";
    const actions = document.createElement("div");
    actions.style.display = "flex";
    actions.style.gap = "8px";
    actions.style.flexWrap = "wrap";
    if (page !== INTRO) {
      const done = doneSet().has(page.id);
      wrap.classList.toggle("is-done", done);
      text.innerHTML = "<b></b><span></span>";
      text.querySelector("b").textContent = done ? "Módulo concluído" : "Terminou o módulo?";
      text.querySelector("span").textContent = done ? "Ele aparece com um visto no índice e conta no seu progresso." : "Marque como concluído para acompanhar o seu progresso.";
      const mark = document.createElement("button");
      mark.type = "button";
      mark.className = "btn" + (done ? "" : " primary");
      mark.innerHTML = done ? ICON.checkCircle + "Concluído" : ICON.check + "Marcar como concluído";
      if (done) mark.title = "Clique para desmarcar";
      mark.addEventListener("click", () => {
        const set = doneSet();
        if (set.has(page.id)) set.delete(page.id); else set.add(page.id);
        store(DONE_KEY, [...set].join(","));
        updateProgress();
        buildNav();
        renderFinish(page);
      });
      actions.appendChild(mark);
    } else {
      text.innerHTML = "<b>Pronto para começar?</b><span>O primeiro módulo tira o FortiGate da caixa.</span>";
    }
    if (next) {
      const go = document.createElement("a");
      go.className = "btn" + (page === INTRO ? " primary" : "");
      go.href = "#" + next.id;
      go.style.textDecoration = "none";
      go.innerHTML = "<span></span>" + ICON.next;
      go.querySelector("span").textContent = (next.extra ? "Apêndice " : "Módulo ") + next.num;
      actions.appendChild(go);
    }
    void order;
    wrap.append(text, actions);
    box.appendChild(wrap);
  }

  function showError(path, err) {
    $("doc").innerHTML = "";
    const p = document.createElement("div");
    p.className = "status error";
    p.textContent = "Não foi possível carregar o conteúdo (" + err.message + "). Verifique a conexão e tente de novo.";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Tentar de novo";
    b.addEventListener("click", () => { current = null; route(); });
    p.appendChild(document.createElement("br"));
    p.appendChild(b);
    $("doc").appendChild(p);
  }

  function setTopbar(page) {
    const tt = $("topbar-title");
    tt.innerHTML = "";
    const bold = document.createElement("b");
    bold.textContent = page === INTRO ? "Introdução" : (page.extra ? "Apêndice " : "Módulo ") + page.num;
    tt.append(bold, document.createTextNode(" · " + (page === INTRO ? "Curso FortiGate 7.6" : page.title)));
  }

  function scrollToSlug(slug, smooth) {
    const h = slug && document.getElementById(slug);
    if (h) h.scrollIntoView({ behavior: smooth && !reducedMotion ? "smooth" : "auto", block: "start" });
    else window.scrollTo(0, 0);
  }

  let routeToken = 0;
  async function route() {
    const token = ++routeToken;
    const [id, slug] = location.hash.slice(1).split("/");
    const page = PAGES.find((p) => p.id === id) || INTRO;
    closeDrawer();
    if (current === page) { scrollToSlug(slug, true); return; }
    current = page;
    openSet.add(page.id);
    buildNav();
    setTopbar(page);
    $("finish").innerHTML = "";
    if (!page.file) { renderSoon(page); window.scrollTo(0, 0); return; }
    $("doc").innerHTML = '<p class="status">Carregando…</p>';
    window.scrollTo(0, 0);
    try {
      const text = await getText(page.file);
      if (token !== routeToken) return;
      renderDoc(text, page);
      renderFinish(page);
      requestAnimationFrame(() => { scrollToSlug(slug, false); spyUpdate(true); });
    } catch (err) {
      if (token === routeToken) { current = null; showError(page.file, err); }
    }
  }

  /* Links do índice para seções do módulo aberto: rola sem recarregar. */
  $("nav").addEventListener("click", (e) => {
    const a = e.target.closest(".nav-sub a");
    if (!a) return;
    const [id, slug] = a.getAttribute("href").slice(1).split("/");
    if (current && current.id === id) {
      e.preventDefault();
      history.replaceState(null, "", "#" + id + "/" + slug);
      closeDrawer();
      scrollToSlug(slug, true);
    }
  });

  /* ---------- Drawer (telas estreitas) ---------- */
  function openDrawer() { $("app").classList.add("drawer-open"); $("menu-btn").setAttribute("aria-expanded", "true"); }
  function closeDrawer() { $("app").classList.remove("drawer-open"); $("menu-btn").setAttribute("aria-expanded", "false"); }
  $("menu-btn").addEventListener("click", () => { $("app").classList.contains("drawer-open") ? closeDrawer() : openDrawer(); });
  $("backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.querySelector("dialog[open]")) closeDrawer(); });

  $("search").addEventListener("input", buildNav);
  window.addEventListener("hashchange", route);

  updateProgress();
  buildNav();
  loadOutlines().then(() => { buildNav(); });
  route();
})();
</script>
