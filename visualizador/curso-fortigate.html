<title>Curso FortiGate Administrator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: leitor de documentação — índice de módulos à esquerda, texto central em ~72ch, mapa da seção à direita em telas largas. Tema escuro único, por escolha. */
:root {
  color-scheme: dark;
  --bg: #111317;
  --panel: #15181c;
  --raise: #1c2026;
  --line: #262b32;
  --line-strong: #343a43;
  --text: #d8dce2;
  --muted: #8c939d;
  --faint: #626a75;
  --accent: #e2a654;
  --accent-soft: rgba(226, 166, 84, 0.12);
  --code-bg: #0c0e11;
  --warn: #ee8a76;
  --warn-bg: rgba(238, 138, 118, 0.09);
  --tip: #74c3b1;
  --tip-bg: rgba(116, 195, 177, 0.08);
  --exam: #ab9ef0;
  --exam-bg: rgba(171, 158, 240, 0.09);
  --ver: #82b4ee;
  --ver-bg: rgba(130, 180, 238, 0.09);
  --note-bg: rgba(140, 147, 157, 0.08);

  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --sidebar-w: 288px;
  --toc-w: 220px;
  --topbar-h: 56px;
}

html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--panel);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Estrutura ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-block: 24px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
}

.brand { display: flex; flex-direction: column; gap: 4px; padding-inline: 8px; }
.brand-name {
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.01em;
  color: var(--text);
  text-decoration: none;
  line-height: 1.2;
}
.brand-meta {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--faint);
}
.brand-meta b { color: var(--accent); font-weight: 500; }

.search {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 10px;
  font: inherit;
  font-size: 0.88rem;
}
.search::placeholder { color: var(--faint); }
.search:focus { border-color: var(--line-strong); outline: none; }

.progress { display: flex; flex-direction: column; gap: 6px; padding-inline: 8px; }
.progress-label { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.progress-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }

.nav { display: flex; flex-direction: column; gap: 18px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--faint);
  padding: 0 8px 6px;
}
.nav-link {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 8px;
  align-items: baseline;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  text-decoration: none;
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.35;
}
.nav-link:hover { background: var(--raise); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--raise); color: var(--text); }
.nav-link[aria-current="page"] .nav-num { color: var(--accent); }
.nav-num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-dot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1px solid var(--faint);
  align-self: center;
}
.nav-dot.has-content { background: var(--accent); border-color: var(--accent); }
.nav-empty { font-size: 0.82rem; color: var(--faint); padding: 4px 8px; }

.legend { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-inline: 8px; font-size: 0.75rem; color: var(--faint); }
.legend span { display: flex; align-items: center; gap: 8px; }

/* ---------- Topbar (telas estreitas) ---------- */
.topbar {
  display: none;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  height: var(--topbar-h);
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.menu-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  cursor: pointer;
  flex: none;
}
.menu-btn svg { width: 18px; height: 18px; }
.topbar-title { min-width: 0; font-size: 0.92rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title b { color: var(--text); font-weight: 500; }
.backdrop { display: none; }

/* ---------- Conteúdo ---------- */
.main {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--toc-w);
  gap: 48px;
  padding-block: 40px 80px;
  padding-left: 56px;
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
.article { min-width: 0; max-width: 760px; }

.view-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.view-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.72rem; letter-spacing: 0.04em;
  border-radius: 999px; padding: 2px 10px;
  border: 1px solid var(--line-strong);
  color: var(--muted);
}
.pill.ready { color: var(--accent); border-color: rgba(226,166,84,.35); background: var(--accent-soft); }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.segmented button {
  background: transparent; border: 0; color: var(--muted);
  font: inherit; font-size: 0.8rem;
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.segmented button:disabled { color: var(--faint); cursor: not-allowed; }

.status { color: var(--muted); padding: 40px 0; }
.status.error { color: var(--warn); }
.status button {
  margin-top: 12px; background: var(--raise); color: var(--text);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer;
}

/* Tipografia do documento */
.doc { font-size: 1rem; }
.doc > :first-child { margin-top: 0; }
.doc h1, .doc h2, .doc h3, .doc h4 { text-wrap: balance; scroll-margin-top: 24px; color: var(--text); }
.doc h1 {
  font-family: var(--font-display);
  font-size: 2.1rem;
  line-height: 1.15;
  letter-spacing: -0.005em;
  margin: 0 0 24px;
}
.doc h2 {
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 1.25;
  margin: 56px 0 16px;
}
.doc h3 { font-size: 1.15rem; font-weight: 600; line-height: 1.35; margin: 40px 0 12px; }
.doc h4 { font-size: 1rem; font-weight: 600; margin: 28px 0 8px; color: var(--text); }
.doc p, .doc ul, .doc ol { margin: 0 0 16px; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 4px 0; }
.doc li > p { margin: 0 0 6px; }
.doc strong { color: #eef0f3; font-weight: 600; }
.doc em { color: var(--muted); }
.doc a { color: var(--accent); text-underline-offset: 3px; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 56px 0; }
.doc code {
  font-family: var(--font-mono);
  font-size: 0.86em;
  background: var(--raise);
  color: #f0c987;
  padding: 1px 6px;
  border-radius: 4px;
  overflow-wrap: anywhere;
}

/* Blocos de código */
.codeblock { margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
.codeblock-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 8px 6px 14px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--faint);
}
.copy-btn {
  background: transparent; border: 1px solid transparent; color: var(--muted);
  font-family: var(--font-body); font-size: 0.75rem; text-transform: none; letter-spacing: 0;
  padding: 3px 10px; border-radius: 6px; cursor: pointer;
}
.copy-btn:hover { border-color: var(--line-strong); color: var(--text); }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
.codeblock code {
  background: none; padding: 0; color: #cfd6de;
  font-size: 0.84rem; line-height: 1.6; overflow-wrap: normal; white-space: pre;
}

/* Tabelas */
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 9px 14px; border-bottom: 1px solid var(--line); }
.doc tr:last-child td { border-bottom: 0; }
.doc th {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); background: var(--panel);
}

/* Quadros (blockquotes) */
.doc blockquote {
  margin: 0 0 20px; padding: 14px 18px;
  border-radius: 8px; background: var(--note-bg);
  border: 1px solid var(--line);
}
.doc blockquote > :last-child { margin-bottom: 0; }
.doc blockquote p { margin-bottom: 8px; }
.doc blockquote.callout-warn { background: var(--warn-bg); border-color: rgba(238,138,118,.22); }
.doc blockquote.callout-warn > p:first-child > strong:first-child { color: var(--warn); }
.doc blockquote.callout-tip { background: var(--tip-bg); border-color: rgba(116,195,177,.2); }
.doc blockquote.callout-tip > p:first-child > strong:first-child { color: var(--tip); }
.doc blockquote.callout-exam { background: var(--exam-bg); border-color: rgba(171,158,240,.22); }
.doc blockquote.callout-exam > p:first-child > strong:first-child { color: var(--exam); }
.doc blockquote.callout-ver { background: var(--ver-bg); border-color: rgba(130,180,238,.22); }
.doc blockquote.callout-ver > p:first-child > strong:first-child { color: var(--ver); }

/* Checklist */
.doc li.task { list-style: none; margin-left: -1.4em; display: flex; gap: 10px; align-items: flex-start; }
.doc li.task input { margin-top: 0.35em; accent-color: var(--accent); width: 16px; height: 16px; flex: none; cursor: pointer; }
.doc li.task.done { color: var(--muted); }

/* Gabarito */
.doc details { margin: 0 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.doc details summary { cursor: pointer; padding: 12px 16px; color: var(--accent); font-weight: 500; }
.doc details[open] summary { border-bottom: 1px solid var(--line); }
.doc details .details-body { padding: 12px 16px 4px; }


/* Figuras, vídeos e GIFs */
.figure, .slides { margin: 4px 0 28px; display: flex; flex-direction: column; gap: 10px; }
.media-frame {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--code-bg);
}
.media-frame img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.media-frame video { display: block; width: 100%; height: auto; background: var(--code-bg); }
.media-badge {
  position: absolute; top: 10px; left: 10px;
  font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text); background: rgba(12, 14, 17, 0.78);
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 7px;
  pointer-events: none;
}
.media-frame.is-placeholder { border-style: dashed; border-color: var(--line-strong); }
.placeholder {
  aspect-ratio: 16 / 9;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 24px; text-align: center;
  background:
    repeating-linear-gradient(135deg, transparent 0 14px, rgba(255, 255, 255, 0.018) 14px 28px),
    var(--code-bg);
}
.placeholder-tag {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); border: 1px solid rgba(226, 166, 84, 0.35); background: var(--accent-soft);
  border-radius: 999px; padding: 2px 10px;
}
.placeholder-desc { color: var(--text); font-size: 0.92rem; line-height: 1.5; max-width: 54ch; }
.placeholder-path { font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); overflow-wrap: anywhere; }
.caption { font-size: 0.93rem; color: var(--muted); line-height: 1.6; }
.caption p { margin: 0 0 6px; }
.caption p:last-child { margin-bottom: 0; }
.caption strong { color: var(--text); }
.caption code { font-size: 0.85em; }

/* Slides */
.slides { outline: none; }
.slides:focus-visible .slides-stage { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.slides-stage { position: relative; touch-action: pan-y; }
.slides-controls { display: flex; align-items: center; gap: 12px; }
.slide-btn {
  width: 36px; height: 36px; flex: none;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  display: grid; place-items: center; cursor: pointer;
}
.slide-btn:hover:not(:disabled) { border-color: var(--line-strong); background: var(--raise); }
.slide-btn:disabled { color: var(--faint); cursor: default; }
.slide-btn svg { width: 16px; height: 16px; }
.slides-count { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
.slides-dots { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: center; }
.slides-dots button {
  width: 22px; height: 22px; border: 0; background: transparent; padding: 0; cursor: pointer;
  display: grid; place-items: center;
}
.slides-dots button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.slides-dots button[aria-current="true"]::before { background: var(--accent); }

/* Botão do guia CLI */
.cli-trigger {
  display: flex; align-items: center; gap: 14px;
  width: 100%; margin: 32px 0 8px; padding: 14px 16px;
  text-align: left; font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer;
}
.cli-trigger:hover { border-color: var(--line-strong); background: var(--raise); }
.cli-icon {
  flex: none; font-family: var(--font-mono); font-size: 0.82rem; color: var(--accent);
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
}
.cli-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.cli-text b { font-weight: 600; font-size: 0.95rem; }
.cli-text span { font-size: 0.82rem; color: var(--muted); }
.cli-arrow { margin-left: auto; color: var(--faint); flex: none; }

/* Modal e ampliação */
dialog.modal {
  padding: 0; border: 1px solid var(--line-strong); border-radius: 12px;
  background: var(--panel); color: var(--text);
  width: min(880px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  overflow: hidden;
}
dialog.modal[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(5, 6, 8, 0.74); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 16px 14px 24px; border-bottom: 1px solid var(--line); flex: none;
}
.modal-eyebrow { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.modal-title { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.25; margin: 2px 0 0; }
.icon-btn {
  width: 36px; height: 36px; flex: none;
  border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: var(--raise); border-color: var(--line-strong); }
.icon-btn svg { width: 16px; height: 16px; }
.modal-body { overflow-y: auto; padding: 20px 24px 32px; }
.modal-body.doc h3 { font-family: var(--font-display); font-size: 1.15rem; margin: 36px 0 12px; }
.modal-body.doc > :first-child { margin-top: 0; }

dialog.lightbox {
  padding: 0; border: 0; background: transparent; color: var(--text);
  max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh;
}
dialog.lightbox[open] { display: grid; place-items: center; }
.lightbox-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 56px 16px 24px; max-width: 100%; }
.lightbox-inner img {
  max-width: min(1400px, 94vw); max-height: 80dvh; width: auto; height: auto;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--code-bg); cursor: zoom-out;
}
.lightbox-inner .caption { max-width: 72ch; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; color: var(--muted); }
.lightbox-close {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  background: var(--panel);
}

/* Navegação anterior/próximo */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); }
.pager a {
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
  text-decoration: none; color: var(--text); min-width: 0;
}
.pager a:hover { border-color: var(--line-strong); background: var(--panel); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { font-size: 0.72rem; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }
.pager span { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Mapa da página */
.toc {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 40px);
  align-self: start;
  max-height: calc(100vh - 80px);
  overflow-y: auto;
  font-size: 0.8rem;
}
.toc-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--faint); margin-bottom: 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.toc a {
  display: block; text-decoration: none; color: var(--faint);
  padding: 3px 0 3px 10px; border-left: 1px solid var(--line); line-height: 1.4;
}
.toc a.lvl-3 { padding-left: 22px; }
.toc a:hover { color: var(--text); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ---------- Responsivo ---------- */
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); padding-left: 40px; }
  .toc { display: none; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; }
  .sidebar {
    position: fixed;
    top: 0; bottom: 0; left: 0;
    height: auto;
    width: min(320px, 86vw);
    z-index: 50;
    transform: translateX(-102%);
    transition: transform 0.2s ease;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .app.drawer-open .sidebar { transform: translateX(0); }
  .app.drawer-open .backdrop {
    display: block; position: fixed; inset: 0; z-index: 45;
    background: rgba(5, 6, 8, 0.6);
  }
  .main {
    padding-block: 28px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function () {
  // Para publicar um novo módulo: adicione o arquivo .md e preencha "file".
  const MODULES = [
    { id: "m01", num: "01", title: "Primeiro acesso e administração básica", marker: "## 01.", file: "conteudo/modulo-01-primeiro-acesso-e-administracao-basica.md" },
    { id: "m02", num: "02", title: "Interfaces e serviços de rede", marker: "## 02." },
    { id: "m03", num: "03", title: "Firewall policies", marker: "## 03." },
    { id: "m04", num: "04", title: "Logs, sessões e verificação", marker: "## 04." },
    { id: "m05", num: "05", title: "NAT", marker: "## 05." },
    { id: "m06", num: "06", title: "Roteamento", marker: "## 06." },
    { id: "m07", num: "07", title: "Autenticação", marker: "## 07." },
    { id: "m08", num: "08", title: "FSSO e SSO", marker: "## 08." },
    { id: "m09", num: "09", title: "Certificados e inspeção SSL/TLS", marker: "## 09." },
    { id: "m10", num: "10", title: "Security Profiles: fundamentos, Web Filter e DNS Filter", marker: "## 10." },
    { id: "m11", num: "11", title: "Application Control, IPS e DoS", marker: "## 11." },
    { id: "m12", num: "12", title: "Antivirus e inspeção de arquivos", marker: "## 12." },
    { id: "m13", num: "13", title: "VPN IPsec", marker: "## 13." },
    { id: "m14", num: "14", title: "SD-WAN", marker: "## 14." },
    { id: "m15", num: "15", title: "Security Fabric", marker: "## 15." },
    { id: "m16", num: "16", title: "Alta disponibilidade", marker: "## 16." },
    { id: "m17", num: "17", title: "Diagnóstico e projeto final", marker: "## 17." },
    { id: "ma", num: "A", title: "FortiSwitch e FortiAP", marker: "## Apêndice A.", extra: true },
    { id: "mb", num: "B", title: "VDOMs", marker: "## Apêndice B.", extra: true },
    { id: "mc", num: "C", title: "ZTNA básico", marker: "## Apêndice C.", extra: true }
  ];
  const GRADE_FILE = "grade.md";

  const $ = (id) => document.getElementById(id);
  const cache = {};
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let preferredView = "conteudo";
  let spy = null;

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
  }

  async function getText(path) {
    if (cache[path]) return cache[path];
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    cache[path] = text;
    return text;
  }

  function gradeSlice(grade, marker) {
    const idx = grade.indexOf("\n" + marker);
    if (idx < 0) return null;
    const start = idx + 1;
    const next = grade.indexOf("\n## ", start + 3);
    return grade.slice(start, next < 0 ? undefined : next).replace(/\n-{3,}\s*$/, "").trim();
  }

  function overviewSlice(grade) {
    const idx = grade.indexOf("\n## 01.");
    return (idx < 0 ? grade : grade.slice(0, idx)).replace(/\n-{3,}\s*$/, "").trim();
  }

  function slugify(text, used) {
    let base = text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "secao";
    let slug = base, n = 2;
    while (used.has(slug)) slug = base + "-" + n++;
    used.add(slug);
    return slug;
  }

  /* ---------- Sidebar ---------- */
  function buildNav(filter) {
    const nav = $("nav");
    const q = (filter || "").trim().toLowerCase();
    const match = (m) => !q || (m.num + " " + m.title).toLowerCase().includes(q);
    const groups = [
      { label: "Visão geral", items: [{ id: "visao-geral", num: "—", title: "Sobre o curso e cenário", overview: true }] },
      { label: "Módulos", items: MODULES.filter((m) => !m.extra) },
      { label: "Além do NSE 4", items: MODULES.filter((m) => m.extra) }
    ];
    nav.innerHTML = "";
    let shown = 0;
    groups.forEach((g) => {
      const items = g.items.filter(match);
      if (!items.length) return;
      const wrap = document.createElement("div");
      wrap.className = "nav-group";
      const t = document.createElement("div");
      t.className = "nav-title";
      t.textContent = g.label;
      wrap.appendChild(t);
      items.forEach((m) => {
        const a = document.createElement("a");
        a.className = "nav-link";
        a.href = "#" + m.id;
        a.dataset.id = m.id;
        const dot = m.overview ? "" : '<i class="nav-dot' + (m.file ? " has-content" : "") + '" aria-hidden="true"></i>';
        a.innerHTML = '<span class="nav-num"></span><span class="nav-text"></span>' + dot;
        a.querySelector(".nav-num").textContent = m.num;
        a.querySelector(".nav-text").textContent = m.title;
        if (!m.overview) a.title = m.file ? "Conteúdo pronto" : "Somente a grade";
        wrap.appendChild(a);
        shown++;
      });
      nav.appendChild(wrap);
    });
    if (!shown) nav.innerHTML = '<p class="nav-empty">Nenhum módulo encontrado.</p>';
    markActive();
  }

  function markActive() {
    const current = location.hash.slice(1) || "visao-geral";
    document.querySelectorAll(".nav-link").forEach((a) => {
      if (a.dataset.id === current) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function updateProgress() {
    const done = MODULES.filter((m) => m.file).length;
    $("progress-count").textContent = done + " de " + MODULES.length;
    $("progress-fill").style.width = (done / MODULES.length) * 100 + "%";
  }


  /* ---------- Blocos especiais: :::figura, :::slides, :::cli ---------- */
  function toggleFence(open, marker) {
    if (!open) return marker;
    return marker[0] === open[0] && marker.length >= open.length ? null : open;
  }

  function preprocess(md) {
    const lines = md.split("\n");
    const out = [];
    const blocks = [];
    let fence = null;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const f = line.match(/^\s*(`{3,}|~{3,})/);
      if (!fence) {
        const c = line.match(/^:::(figura|slides|cli)\b\s*(.*)$/);
        if (c) {
          const body = [];
          let inner = null, j = i + 1;
          for (; j < lines.length; j++) {
            const l = lines[j];
            const g = l.match(/^\s*(`{3,}|~{3,})/);
            if (g) inner = toggleFence(inner, g[1]);
            if (!inner && /^:::\s*$/.test(l)) break;
            body.push(l);
          }
          blocks.push({ type: c[1], args: c[2].trim(), body: body.join("\n") });
          out.push("", '<div data-block="' + (blocks.length - 1) + '"></div>', "");
          i = j;
          continue;
        }
      }
      if (f) fence = toggleFence(fence, f[1]);
      out.push(line);
    }
    return { md: out.join("\n"), blocks };
  }

  function parseSpec(text) {
    const m = text.trim().match(/^(\S+)(?:\s+"([^"]*)")?(?:\s*\|\s*([\s\S]*))?$/);
    if (!m) return null;
    return { src: m[1], alt: m[2] || "", caption: (m[3] || "").trim() };
  }

  function mediaKind(src) {
    if (/\.(mp4|webm)(\?|$)/i.test(src)) return "video";
    if (/\.gif(\?|$)/i.test(src)) return "gif";
    return "image";
  }

  function placeholder(frame, spec, kind) {
    frame.classList.add("is-placeholder");
    frame.innerHTML = "";
    const box = document.createElement("div");
    box.className = "placeholder";
    const tag = document.createElement("span");
    tag.className = "placeholder-tag";
    tag.textContent = kind === "video" ? "Vídeo pendente" : kind === "gif" ? "GIF pendente" : "Captura pendente";
    const desc = document.createElement("div");
    desc.className = "placeholder-desc";
    desc.textContent = spec.alt || "Mídia ainda não adicionada.";
    const path = document.createElement("div");
    path.className = "placeholder-path";
    path.textContent = spec.src;
    box.append(tag, desc, path);
    frame.appendChild(box);
  }

  function buildMedia(spec, captionHtml) {
    const kind = mediaKind(spec.src);
    const frame = document.createElement("div");
    frame.className = "media-frame";
    if (kind === "video") {
      const v = document.createElement("video");
      v.muted = true;
      v.loop = true;
      v.playsInline = true;
      v.controls = true;
      v.preload = "metadata";
      if (!reducedMotion) v.autoplay = true;
      v.setAttribute("aria-label", spec.alt || "Vídeo");
      v.addEventListener("error", () => placeholder(frame, spec, kind));
      v.src = spec.src;
      frame.appendChild(v);
      const badge = document.createElement("span");
      badge.className = "media-badge";
      badge.textContent = "Vídeo";
      frame.appendChild(badge);
    } else {
      const img = document.createElement("img");
      img.alt = spec.alt;
      img.decoding = "async";
      img.addEventListener("error", () => placeholder(frame, spec, kind));
      img.addEventListener("click", () => openLightbox(spec.src, spec.alt, captionHtml));
      img.src = spec.src;
      frame.appendChild(img);
      if (kind === "gif") {
        const badge = document.createElement("span");
        badge.className = "media-badge";
        badge.textContent = "GIF";
        frame.appendChild(badge);
      }
    }
    return frame;
  }

  function captionEl(html) {
    const c = document.createElement("div");
    c.className = "caption";
    c.innerHTML = html;
    return c;
  }

  function buildFigure(block) {
    const spec = parseSpec(block.args);
    const fig = document.createElement("figure");
    fig.className = "figure";
    if (!spec) { fig.textContent = "Figura sem arquivo definido."; return fig; }
    const capHtml = block.body.trim() ? marked.parse(block.body.trim()) : "";
    fig.appendChild(buildMedia(spec, capHtml));
    if (capHtml) {
      const fc = document.createElement("figcaption");
      fc.className = "caption";
      fc.innerHTML = capHtml;
      fig.appendChild(fc);
    }
    return fig;
  }

  const ICON_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  const ICON_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  function buildSlides(block) {
    const items = block.body.split("\n").map(parseSpec).filter(Boolean);
    const wrap = document.createElement("section");
    wrap.className = "slides";
    wrap.tabIndex = 0;
    wrap.setAttribute("aria-roledescription", "carrossel");
    wrap.setAttribute("aria-label", "Passo a passo com " + items.length + " imagens");
    if (!items.length) { wrap.textContent = "Slides sem imagens definidas."; return wrap; }

    const stage = document.createElement("div");
    stage.className = "slides-stage";
    const frames = items.map((it) => {
      const cap = it.caption ? marked.parseInline(it.caption) : "";
      const fr = buildMedia(it, cap);
      fr.hidden = true;
      stage.appendChild(fr);
      return { frame: fr, cap };
    });
    const caption = captionEl("");
    caption.setAttribute("aria-live", "polite");

    const controls = document.createElement("div");
    controls.className = "slides-controls";
    const prev = document.createElement("button");
    prev.type = "button"; prev.className = "slide-btn"; prev.innerHTML = ICON_PREV; prev.setAttribute("aria-label", "Imagem anterior");
    const next = document.createElement("button");
    next.type = "button"; next.className = "slide-btn"; next.innerHTML = ICON_NEXT; next.setAttribute("aria-label", "Próxima imagem");
    const count = document.createElement("span");
    count.className = "slides-count";
    const dots = document.createElement("div");
    dots.className = "slides-dots";
    const dotBtns = items.map((_, i) => {
      const d = document.createElement("button");
      d.type = "button";
      d.setAttribute("aria-label", "Ir para a imagem " + (i + 1));
      d.addEventListener("click", () => go(i));
      dots.appendChild(d);
      return d;
    });
    controls.append(prev, dots, count, next);

    let current = 0;
    function go(i) {
      current = Math.max(0, Math.min(items.length - 1, i));
      frames.forEach((f, k) => {
        f.frame.hidden = k !== current;
        const v = f.frame.querySelector("video");
        if (v) { if (k === current && !reducedMotion) v.play().catch(() => {}); else v.pause(); }
      });
      caption.innerHTML = frames[current].cap;
      caption.hidden = !frames[current].cap;
      count.textContent = (current + 1) + " / " + items.length;
      prev.disabled = current === 0;
      next.disabled = current === items.length - 1;
      dotBtns.forEach((d, k) => d.setAttribute("aria-current", String(k === current)));
    }
    prev.addEventListener("click", () => go(current - 1));
    next.addEventListener("click", () => go(current + 1));
    wrap.addEventListener("keydown", (e) => {
      if (e.target !== wrap) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
    });
    let startX = null;
    stage.addEventListener("pointerdown", (e) => { startX = e.clientX; });
    stage.addEventListener("pointerup", (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) > 48) go(current + (dx < 0 ? 1 : -1));
    });

    wrap.append(stage, controls, caption);
    go(0);
    return wrap;
  }

  function buildCli(block) {
    const title = block.args || "Comandos desta seção";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cli-trigger";
    btn.innerHTML = '<span class="cli-icon" aria-hidden="true">&gt;_</span><span class="cli-text"><b>Guia de comandos CLI</b><span></span></span><span class="cli-arrow" aria-hidden="true">' + ICON_NEXT + "</span>";
    btn.querySelector(".cli-text span").textContent = title;
    btn.addEventListener("click", () => openCli(title, block.body, btn));
    return btn;
  }

  function mountBlocks(container, blocks) {
    container.querySelectorAll("div[data-block]").forEach((el) => {
      const b = blocks[Number(el.dataset.block)];
      if (!b) return;
      const node = b.type === "figura" ? buildFigure(b) : b.type === "slides" ? buildSlides(b) : buildCli(b);
      el.replaceWith(node);
    });
  }

  /* ---------- Modal do guia CLI ---------- */
  const cliModal = $("cli-modal");
  let cliReturn = null;
  function openCli(title, body, trigger) {
    cliReturn = trigger;
    $("cli-modal-title").textContent = title;
    const bodyEl = $("cli-modal-body");
    const pre = preprocess(body);
    bodyEl.innerHTML = marked.parse(pre.md, { gfm: true, headerIds: false, mangle: false });
    mountBlocks(bodyEl, pre.blocks);
    enhanceBasic(bodyEl);
    bodyEl.scrollTop = 0;
    if (cliModal.showModal) cliModal.showModal(); else cliModal.setAttribute("open", "");
    $("cli-modal-close").focus();
  }
  function closeCli() {
    if (cliModal.close) cliModal.close(); else cliModal.removeAttribute("open");
  }
  cliModal.addEventListener("close", () => { if (cliReturn) cliReturn.focus(); });
  cliModal.addEventListener("click", (e) => { if (e.target === cliModal) closeCli(); });
  $("cli-modal-close").addEventListener("click", closeCli);

  /* ---------- Ampliação de imagens ---------- */
  const lightbox = $("lightbox");
  function openLightbox(src, alt, captionHtml) {
    const inner = $("lightbox-inner");
    inner.innerHTML = "";
    const img = document.createElement("img");
    img.src = src;
    img.alt = alt;
    img.addEventListener("click", closeLightbox);
    inner.appendChild(img);
    if (captionHtml) inner.appendChild(captionEl(captionHtml));
    if (lightbox.showModal) lightbox.showModal(); else lightbox.setAttribute("open", "");
    $("lightbox-close").focus();
  }
  function closeLightbox() {
    if (lightbox.close) lightbox.close(); else lightbox.removeAttribute("open");
  }
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox || e.target.id === "lightbox-inner") closeLightbox(); });
  $("lightbox-close").addEventListener("click", closeLightbox);

  /* ---------- Renderização ---------- */
  function enhance(container, ctx) {
    const used = new Set();
    container.querySelectorAll("h1, h2, h3, h4").forEach((h) => { h.id = slugify(h.textContent, used); });
    enhanceBasic(container);
    enhanceInteractive(container, ctx);
  }

  function enhanceBasic(container) {
    container.querySelectorAll("pre").forEach((pre) => {
      const code = pre.querySelector("code");
      const text = (code ? code.textContent : pre.textContent).replace(/\n$/, "");
      const first = text.split("\n")[0].trim();
      let label = "Saída";
      if (/^#config-version/.test(first)) label = "Arquivo de configuração";
      else if (/[─│┌└\[]/.test(text) && /(──|\[)/.test(first)) label = "Diagrama";
      else if (/^(config|execute|diagnose|get|show|set|edit|append|unselect|FGT-?\S* #)/.test(first)) label = "CLI";
      const box = document.createElement("div");
      box.className = "codeblock";
      const head = document.createElement("div");
      head.className = "codeblock-head";
      const lbl = document.createElement("span");
      lbl.textContent = label;
      const btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.type = "button";
      btn.textContent = "Copiar";
      btn.addEventListener("click", () => {
        const done = () => { btn.textContent = "Copiado"; setTimeout(() => (btn.textContent = "Copiar"), 1400); };
        const fallback = () => {
          const range = document.createRange();
          range.selectNodeContents(code || pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          btn.textContent = "Selecionado — use Ctrl+C";
          setTimeout(() => (btn.textContent = "Copiar"), 2200);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
          else fallback();
        } catch (e) { fallback(); }
      });
      head.append(lbl, btn);
      pre.parentNode.insertBefore(box, pre);
      box.append(head, pre);
    });

    container.querySelectorAll("table").forEach((t) => {
      const w = document.createElement("div");
      w.className = "table-wrap";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });

    container.querySelectorAll("blockquote").forEach((bq) => {
      const s = bq.querySelector("p > strong:first-child");
      const label = s ? s.textContent.trim().toLowerCase() : "";
      if (label.startsWith("atenção")) bq.classList.add("callout-warn");
      else if (label.startsWith("na prática")) bq.classList.add("callout-tip");
      else if (label.startsWith("dica para a prova")) bq.classList.add("callout-exam");
      else if (label.startsWith("na prova")) bq.classList.add("callout-ver");
    });
  }

  function enhanceInteractive(container, ctx) {

    container.querySelectorAll('li input[type="checkbox"]').forEach((box, i) => {
      const li = box.closest("li");
      li.classList.add("task");
      box.disabled = false;
      const key = "fgt-check:" + ctx + ":" + i;
      const saved = store(key) === "1";
      box.checked = saved;
      li.classList.toggle("done", saved);
      const label = li.textContent.trim().slice(0, 80);
      box.setAttribute("aria-label", label);
      box.addEventListener("change", () => {
        store(key, box.checked ? "1" : "0");
        li.classList.toggle("done", box.checked);
      });
    });

    container.querySelectorAll("h3").forEach((h) => {
      if (!/gabarito/i.test(h.textContent)) return;
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Mostrar " + h.textContent.trim().toLowerCase();
      const body = document.createElement("div");
      body.className = "details-body";
      let el = h.nextElementSibling;
      while (el && !/^(H1|H2|H3|HR)$/.test(el.tagName)) {
        const next = el.nextElementSibling;
        body.appendChild(el);
        el = next;
      }
      details.append(summary, body);
      h.replaceWith(details);
    });
  }

  function buildToc(container) {
    const toc = $("toc");
    if (spy) { spy.disconnect(); spy = null; }
    const heads = Array.from(container.querySelectorAll("h2, h3"));
    if (heads.length < 2) { toc.innerHTML = ""; return; }
    toc.innerHTML = '<div class="toc-title">Nesta página</div>';
    const ol = document.createElement("ol");
    const links = new Map();
    heads.forEach((h) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + (location.hash.slice(1) || "visao-geral");
      a.textContent = h.textContent;
      a.className = h.tagName === "H3" ? "lvl-3" : "lvl-2";
      a.addEventListener("click", (e) => {
        e.preventDefault();
        h.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "start" });
      });
      li.appendChild(a);
      ol.appendChild(li);
      links.set(h, a);
    });
    toc.appendChild(ol);
    if ("IntersectionObserver" in window) {
      spy = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          links.forEach((a) => a.classList.remove("active"));
          const a = links.get(en.target);
          if (a) a.classList.add("active");
        });
      }, { rootMargin: "0px 0px -75% 0px" });
      heads.forEach((h) => spy.observe(h));
    }
  }

  function buildPager(id) {
    const order = [{ id: "visao-geral", title: "Visão geral" }].concat(
      MODULES.map((m) => ({ id: m.id, title: (m.extra ? "Apêndice " : "Módulo ") + m.num + " · " + m.title }))
    );
    const i = order.findIndex((o) => o.id === id);
    const pager = $("pager");
    pager.innerHTML = "";
    const make = (o, cls, label) => {
      const a = document.createElement("a");
      a.href = "#" + o.id;
      a.className = cls;
      a.innerHTML = "<small></small><span></span>";
      a.querySelector("small").textContent = label;
      a.querySelector("span").textContent = o.title;
      pager.appendChild(a);
    };
    if (i > 0) make(order[i - 1], "prev", "Anterior");
    if (i < order.length - 1) make(order[i + 1], "next", "Próximo");
  }

  function renderDoc(md, ctx) {
    const doc = $("doc");
    const pre = preprocess(md);
    doc.innerHTML = marked.parse(pre.md, { gfm: true, headerIds: false, mangle: false });
    mountBlocks(doc, pre.blocks);
    enhance(doc, ctx);
    buildToc(doc);
  }

  function showError(path, err) {
    $("doc").innerHTML = "";
    const p = document.createElement("div");
    p.className = "status error";
    p.textContent = "Não foi possível carregar " + path + " (" + err.message + "). Verifique a conexão e tente de novo.";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Tentar de novo";
    b.addEventListener("click", route);
    p.appendChild(document.createElement("br"));
    p.appendChild(b);
    $("doc").appendChild(p);
    $("toc").innerHTML = "";
  }

  function setViewBar(m, hasContent, view) {
    const bar = $("view-bar");
    bar.innerHTML = "";
    const meta = document.createElement("div");
    meta.className = "view-meta";
    if (!m) {
      meta.innerHTML = '<span class="pill">Grade · revisão 6</span>';
    } else {
      const kind = document.createElement("span");
      kind.textContent = (m.extra ? "Apêndice " : "Módulo ") + m.num;
      const pill = document.createElement("span");
      pill.className = "pill" + (hasContent ? " ready" : "");
      pill.textContent = hasContent ? "Conteúdo pronto" : "Conteúdo pendente · exibindo a grade";
      meta.append(kind, pill);
    }
    bar.appendChild(meta);
    if (m) {
      const seg = document.createElement("div");
      seg.className = "segmented";
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", "Alternar visualização");
      [["conteudo", "Conteúdo"], ["grade", "Grade"]].forEach(([key, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.setAttribute("aria-pressed", String(view === key));
        if (key === "conteudo" && !hasContent) b.disabled = true;
        b.addEventListener("click", () => {
          if (view === key) return;
          preferredView = key;
          route();
        });
        seg.appendChild(b);
      });
      bar.appendChild(seg);
    }
    const tt = $("topbar-title");
    tt.innerHTML = "";
    const bold = document.createElement("b");
    bold.textContent = m ? (m.extra ? "Apêndice " : "Módulo ") + m.num : "Visão geral";
    tt.append(bold, document.createTextNode(m ? " · " + m.title : " · FortiGate Administrator"));
  }

  let routeToken = 0;
  async function route() {
    const token = ++routeToken;
    const id = location.hash.slice(1);
    const m = MODULES.find((x) => x.id === id) || null;
    markActive();
    closeDrawer();
    buildPager(m ? m.id : "visao-geral");
    const view = m && m.file && preferredView === "conteudo" ? "conteudo" : "grade";
    setViewBar(m, !!(m && m.file), view);
    $("doc").innerHTML = '<p class="status">Carregando…</p>';
    window.scrollTo(0, 0);

    const path = m && view === "conteudo" ? m.file : GRADE_FILE;
    try {
      const text = await getText(path);
      if (token !== routeToken) return;
      let md;
      if (!m) md = overviewSlice(text);
      else if (view === "conteudo") md = text;
      else md = gradeSlice(text, m.marker) || "Este módulo não foi encontrado na grade.";
      renderDoc(md, (m ? m.id : "visao-geral") + ":" + view);
    } catch (err) {
      if (token === routeToken) showError(path, err);
    }
  }

  /* ---------- Drawer (telas estreitas) ---------- */
  function openDrawer() {
    $("app").classList.add("drawer-open");
    $("menu-btn").setAttribute("aria-expanded", "true");
  }
  function closeDrawer() {
    $("app").classList.remove("drawer-open");
    $("menu-btn").setAttribute("aria-expanded", "false");
  }
  $("menu-btn").addEventListener("click", () => {
    $("app").classList.contains("drawer-open") ? closeDrawer() : openDrawer();
  });
  $("backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.querySelector("dialog[open]")) closeDrawer(); });

  $("search").addEventListener("input", (e) => buildNav(e.target.value));
  window.addEventListener("hashchange", route);

  updateProgress();
  buildNav("");
  route();
})();
</script>
